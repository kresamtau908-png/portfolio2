<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ヒーローのブロック演出と同じ3×3のブロック。右上の1つが欠けた「積み重ねている途中」の形。
       小さく表示されても左上のブロックが土台に溶けないよう、グラデーションの始まりは少し濃い青灰色にしている -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="56" y2="56">
      <stop offset="0" stop-color="#b3c0ce" />
      <stop offset="0.3" stop-color="#7c93ac" />
      <stop offset="1" stop-color="#182338" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f7f4ee" />
  <g fill="url(#g)">
    <rect x="8" y="8" width="14" height="14" />
    <rect x="25" y="8" width="14" height="14" />
    <rect x="8" y="25" width="14" height="14" />
    <rect x="25" y="25" width="14" height="14" />
    <rect x="42" y="25" width="14" height="14" />
    <rect x="8" y="42" width="14" height="14" />
    <rect x="25" y="42" width="14" height="14" />
    <rect x="42" y="42" width="14" height="14" />
  </g>
</svg>
